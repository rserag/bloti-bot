name: blotibot

services:
  worker:
    image: ${BLOTIBOT_IMAGE:-blotibot:local}
    build:
      context: .
      args:
        SOURCE_URL: ${SOURCE_URL:-https://github.com/rserag/bloti-bot}
        VCS_REF: ${VCS_REF:-local}
        VERSION: ${APP_VERSION:-dev}
    platform: linux/amd64
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      API_HASH_FILE: /run/secrets/api_hash
      API_ID_FILE: /run/secrets/api_id
      APP_VERSION: ${APP_VERSION:-dev}
      BOT_TOKEN_FILE: /run/secrets/bot_token
      HEARTBEAT_INTERVAL_SECONDS: "15"
      HEARTBEAT_MAX_AGE_SECONDS: "60"
      HEARTBEAT_PATH: /run/blotibot/heartbeat
      MAX_ACTIVE_CHATS: ${MAX_ACTIVE_CHATS:-4}
      MESSAGE_DELAY_SECONDS: ${MESSAGE_DELAY_SECONDS:-1}
      SESSION_PATH: /var/lib/blotibot/blotibot
      SOURCE_URL: ${SOURCE_URL:-https://github.com/rserag/bloti-bot}
    secrets:
      - api_hash
      - api_id
      - bot_token
    volumes:
      - session-data:/var/lib/blotibot
    tmpfs:
      - /run/blotibot:rw,noexec,nosuid,nodev,size=1m,uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=0700
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

secrets:
  api_hash:
    file: ./secrets/api_hash
  api_id:
    file: ./secrets/api_id
  bot_token:
    file: ./secrets/bot_token

volumes:
  session-data:
