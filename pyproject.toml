[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bloti-bot"
version = "0.1.0"
description = "A Telegram group moderation and member-mention bot"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "telethon==1.44.0",
]

[project.scripts]
blotibot = "blotibot.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blotibot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true
