name: Bug report
description: Report reproducible, non-sensitive incorrect behavior
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include tokens, API credentials, Telegram sessions, private chat content, or personal
        information. Report vulnerabilities through the private security-reporting link instead.
  - type: input
    id: version
    attributes:
      label: Bloti Bot version or commit
      placeholder: 0.1.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Local Python process
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use test data and redact all identifiers and logs.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive-data check
      options:
        - label: I removed credentials, session data, private chat content, and personal information.
          required: true
